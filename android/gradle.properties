org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Windows zipfs, aynı yerel JAR'a paralel derleyici erişiminde kapanışta
# AccessDeniedException üretebiliyor. Tek uygulama modülünde paralellik kazancı
# ihmal edilebilir; deterministik Release derlemesi daha önemlidir.
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
